<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/cue-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <!-- NO viewport-fit=cover, deliberately. DO NOT ADD IT BACK.
         With `cover`, content extends under the safe areas and the page owns the
         insets. Paired with apple-mobile-web-app-status-bar-style="default"
         below — which means "opaque status bar, lay out beneath it" — those are
         contradictory instructions about the same strip of screen. On iOS 27
         (iPhone 17 Pro) that combination made a HOME-SCREEN app mis-map touch
         coordinates after every rotation: taps landed about one button away from
         where controls were painted, in the direction of the rotation, on both
         in-flow and fixed elements. A pinch-zoom reset it; the next rotation
         brought it back.
         Diagnosed by elimination: a normal Safari TAB was fine, while BOTH the
         Safari and Chrome home-screen apps failed — and a tab is exactly where
         these two tags are ignored. Removing `cover` fixed both installs.
         Without it iOS insets the web view itself, so the unsafe areas are
         excluded by the system and every env(safe-area-inset-*) in the app
         correctly resolves to 0. Those rules are harmless and left in place.
         The trade is edge-to-edge rendering: the area around the Dynamic Island
         and home indicator is letterboxed, filled by the html background set in
         index.css (which follows the theme so the bars aren't white in dark mode).
         If edge-to-edge is ever wanted back, `cover` must be paired with
         status-bar-style="black-translucent" AND explicit top padding — and
         re-tested by rotating a home-screen app both directions. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- iOS ignores the manifest for Home Screen installs and reads these
         instead: without apple-mobile-web-app-capable the web clip opens with
         Safari chrome rather than as a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cue" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Cue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
