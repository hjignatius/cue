<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/cue-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves to real values in
         a standalone iOS window; without it the insets are always 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- iOS ignores the manifest for Home Screen installs and reads these
         instead: without apple-mobile-web-app-capable the web clip opens with
         Safari chrome rather than as a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cue" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Cue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
